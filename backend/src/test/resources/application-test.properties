spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:userroles;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${TEST_DB_DDL:create-drop}
spring.jpa.show-sql=false
# H2 (por defecto): esquema generado por Hibernate, sin Flyway (las migraciones son SQL de PostgreSQL).
# PostgreSQL: TEST_FLYWAY=true TEST_DB_DDL=validate ejecuta las migraciones reales y valida las entidades.
spring.flyway.enabled=${TEST_FLYWAY:false}
server.port=0

spring.jpa.properties.hibernate.auto_quote_keyword=true

app.bootstrap.enabled=true
app.bootstrap.username=superadmin
app.bootstrap.email=superadmin@test.local
app.bootstrap.password=SuperAdmin123!

# Independent configuration for tests.
security.jwt.secret=test-signing-secret-not-for-production
security.jwt.issuer=user-management-tests
security.jwt.expiration=30m

# n8n no se invoca en las pruebas: FakeN8nClient sustituye al cliente HTTP.
app.n8n.inbound-token=test-integration-token-0123456789abcdef

# Umbral fijo para las pruebas: validan las reglas con similitudes escogidas alrededor de 0,70 y no
# deben depender del valor calibrado para producción.
app.assistance.min-score=0.70
