# Configuración común a todos los perfiles.
# Los secretos NO tienen valor por defecto: si falta una variable obligatoria,
# la aplicación no arranca (B01). Para desarrollo local, copia .env.example a .env.
spring.application.name=campusdesk-api
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8051}

# Base de datos (obligatorias)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo gestionan las migraciones versionadas de Flyway (db/migration); Hibernate solo lo valida.
# Una base creada antes de adoptar Flyway se toma como versión 1 y recibe las migraciones posteriores.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Sin Open-Session-In-View: cada transacción usa su propio contexto de persistencia. Con el valor
# por defecto (true) la sesión se comparte durante toda la petición HTTP y una segunda transacción
# reutiliza entidades leídas antes de la llamada a n8n; al confirmar, reescribe columnas que otra
# petición cambió entre tanto (actualización perdida). Las relaciones LAZY se leen dentro del servicio.
spring.jpa.open-in-view=false
# La tabla user conserva su nombre y se cita porque USER es palabra reservada.
spring.jpa.properties.hibernate.auto_quote_keyword=true

# JWT (HMAC256). JWT_SECRET es obligatorio y debe tener al menos 32 caracteres.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:campusdesk-api}
# Duración del access token: 30m, 8h o ISO-8601. Corta por defecto (B04); no hay refresh tokens.
security.jwt.expiration=${JWT_EXPIRATION:30m}

# CORS: lista separada por comas de orígenes concretos del frontend. Vacío = ningún origen externo.
# Control de intentos de login: fallos admitidos dentro de la ventana y duración del bloqueo temporal
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window=${LOGIN_ATTEMPT_WINDOW:15m}
app.security.login.lock-duration=${LOGIN_LOCK_DURATION:15m}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Integración con n8n (indexación y asistente RAG). Sin N8N_BASE_URL queda deshabilitada y las
# operaciones terminan en error controlado. Los secretos deben tener al menos 32 caracteres.
app.n8n.base-url=${N8N_BASE_URL:}
app.n8n.service-token=${N8N_SERVICE_TOKEN:}
app.n8n.inbound-token=${INTEGRATION_API_TOKEN:}
app.n8n.index-path=${N8N_INDEX_PATH:/webhook/campusdesk-index}
app.n8n.assist-path=${N8N_ASSIST_PATH:/webhook/campusdesk-assist}
app.n8n.connect-timeout=${N8N_CONNECT_TIMEOUT:5s}
app.n8n.read-timeout=${N8N_READ_TIMEOUT:60s}
app.n8n.max-response-bytes=${N8N_MAX_RESPONSE_BYTES:1048576}

# Asistente RAG. max-results: artículos a recuperar (3 a 5). min-score: umbral de similitud coseno;
# ningún artículo por debajo se acepta como fuente (valor inicial, pendiente de calibrar con el
# modelo de embeddings real). pending-timeout: edad a partir de la cual una consulta sin resultado
# se cierra como ERROR; debe superar dos intentos de N8N_CONNECT_TIMEOUT + N8N_READ_TIMEOUT.
app.assistance.max-results=${ASSIST_MAX_RESULTS:5}
# 0.55: calibrado con openai/text-embedding-3-small (docs/backend/PRUEBAS.md, seccion 9). Recalibrar si cambia el modelo.
app.assistance.min-score=${ASSIST_MIN_SCORE:0.55}
app.assistance.pending-timeout=${ASSIST_PENDING_TIMEOUT:5m}

# Administrador inicial: desactivado salvo que se habilite explícitamente.
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.username=${ADMIN_USERNAME:superadmin}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
