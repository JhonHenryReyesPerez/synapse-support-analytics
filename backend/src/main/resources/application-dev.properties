# Perfil de desarrollo local. Se activa explícitamente con SPRING_PROFILES_ACTIVE=dev.
# No contiene credenciales: DB_*, JWT_SECRET y ADMIN_PASSWORD vienen de .env o del entorno.
spring.jpa.show-sql=true

# En desarrollo se crea el administrador inicial si existen ADMIN_EMAIL y ADMIN_PASSWORD.
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
