# Entorno completo: PostgreSQL, Qdrant, n8n y el backend.
# Copiar .env.example a .env y completar los secretos: sin ellos el entorno no arranca.
# Los puertos se publican solo en 127.0.0.1.

services:
  db:
    image: postgres:17-alpine
    container_name: synapse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campusdesk}
      POSTGRES_USER: ${DB_USERNAME:-campusdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - incidentes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-campusdesk} -d ${DB_NAME:-campusdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.1
    container_name: synapse-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - incidentes_net
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea la colección si no existe y termina.
  qdrant-init:
    image: curlimages/curl:8.11.1
    container_name: synapse-qdrant-init
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-articulos_soporte}
    volumes:
      - ./qdrant:/qdrant:ro
    networks:
      - incidentes_net
    entrypoint: ["/bin/sh", "/qdrant/setup_qdrant.sh"]

  n8n:
    image: n8nio/n8n:2.47.7
    container_name: synapse-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: America/Bogota
      # Los flujos leen su configuración de variables de entorno ($env); no llevan secretos en el JSON.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN:?Definir N8N_SERVICE_TOKEN en .env}
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:?Definir INTEGRATION_API_TOKEN en .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Definir OPENROUTER_API_KEY en .env}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      GENERATION_MODEL: ${GENERATION_MODEL:-google/gemini-2.5-flash}
      GENERATION_MAX_TOKENS: ${GENERATION_MAX_TOKENS:-1500}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-articulos_soporte}
      BACKEND_URL: ${N8N_BACKEND_URL:-http://backend:8051}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    networks:
      - incidentes_net
    depends_on:
      qdrant:
        condition: service_healthy
    # Importa y publica los dos flujos en cada arranque; después inicia n8n.
    entrypoint: ["/bin/sh", "/workflows/start-n8n.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-8051}:8051"
    environment:
      SERVER_PORT: 8051
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-campusdesk}
      DB_USERNAME: ${DB_USERNAME:-campusdesk}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}
      JWT_ISSUER: ${JWT_ISSUER:-campusdesk-api}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-30m}
      APP_TIME_ZONE: America/Bogota
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-superadmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      N8N_BASE_URL: http://n8n:5678
      N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN:?Definir N8N_SERVICE_TOKEN en .env}
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:?Definir INTEGRATION_API_TOKEN en .env}
      ASSIST_MAX_RESULTS: ${ASSIST_MAX_RESULTS:-5}
      ASSIST_MIN_SCORE: ${ASSIST_MIN_SCORE:-0.55}
    depends_on:
      db:
        condition: service_healthy
      n8n:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    networks:
      - incidentes_net

networks:
  incidentes_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
