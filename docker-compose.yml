services:
  db:
    image: postgres:16-alpine
    container_name: synapse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-incidentes_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed_data.sql:/seed_data.sql:ro
    networks:
      - incidentes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-incidentes_db}"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: synapse-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - incidentes_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 3s

  qdrant-init:
    image: curlimages/curl:latest
    container_name: synapse-qdrant-init
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./qdrant:/qdrant
    networks:
      - incidentes_net
    entrypoint: ["/bin/sh", "/qdrant/setup_qdrant.sh"]

  n8n:
    image: n8nio/n8n:latest
    container_name: synapse-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5679}:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5679}/
      - GENERIC_TIMEZONE=America/Bogota
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - N8N_SERVICE_TOKEN=${N8N_SERVICE_TOKEN:-campusdesk-super-secret-service-token-2026}
      - INTEGRATION_API_TOKEN=${INTEGRATION_API_TOKEN:-campusdesk-super-secret-integration-token-2026}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows
    networks:
      - incidentes_net
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME:-incidentes_db}
      - DB_USERNAME=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-incidentes_db}
      - DB_USER=${DB_USER:-postgres}
      - JWT_SECRET=${JWT_SECRET:-campusdesk-super-secret-jwt-key-minimum-32-chars-2026}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-30m}
      - JWT_ISSUER=campusdesk-api
      - N8N_BASE_URL=http://n8n:5678
      - N8N_SERVICE_TOKEN=${N8N_SERVICE_TOKEN:-campusdesk-super-secret-service-token-2026}
      - INTEGRATION_API_TOKEN=${INTEGRATION_API_TOKEN:-campusdesk-super-secret-integration-token-2026}
      - APP_TIME_ZONE=America/Bogota
    depends_on:
      db:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - incidentes_net

networks:
  incidentes_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
